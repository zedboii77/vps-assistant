# VPS Assistant — pre-certbot reverse proxy template (HTTP only).
#
# Why HTTP-only? The TLS certificate doesn't exist until certbot runs, and
# nginx refuses to start if a config points at a missing cert file. Keep this
# minimal block first, run certbot, and it will add the 443 part itself.
#
# Replace YOUR_DOMAIN before use (see README, Production deploy → Option B).
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming: disable buffering + long timeouts
        proxy_buffering off;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }
}
