<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>vpsa — terminal</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0b'/%3E%3Ctext x='4' y='23' font-size='18' font-family='monospace' fill='%23e8e8e8'%3E%26gt;_%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- auth -->
<div id="auth" class="auth-wrap hidden">
  <form id="auth-form" class="auth-card">
    <h1>vps-assistant v1.1</h1>
    <p id="auth-sub">authentication required — enter password</p>
    <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password" required minlength="8">
    <button type="submit" id="auth-btn">[ unlock ]</button>
    <p id="auth-err" class="err"></p>
  </form>
</div>

<!-- app -->
<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <span class="side-title">chats</span>
      <button id="btn-newchat" class="mini-btn">new</button>
    </div>
    <nav id="chat-list" class="chat-list"></nav>
    <div class="side-foot">
      <button id="btn-settings" class="side-btn">cfg — settings</button>
      <button id="btn-logout" class="side-btn">exit — log out</button>
    </div>
  </aside>
  <div id="backdrop" class="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="Chats">≡</button>
      <div class="brand">vpsa</div>
      <div class="top-actions">
        <span id="model-badge" class="badge" title="OpenRouter model">model</span>
        <button id="btn-stop" class="icon-btn hidden" title="Stop the running task">stop</button>
      </div>
    </header>

    <main id="chat" class="chat"></main>

    <footer class="composer-wrap">
      <div class="composer">
        <span class="prompt-char">&gt;</span>
        <textarea id="input" rows="1" placeholder="type a command or question…"
          enterkeyhint="enter"></textarea>
        <button id="btn-mic" aria-label="Dictate" title="Voice input">mic</button>
        <button id="btn-send" aria-label="Send">send</button>
      </div>
      <p class="hint">enter = newline · send transmits · tasks run server-side and survive disconnects</p>
    </footer>
  </div>
</div>

<!-- settings modal -->
<div id="settings" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h2>settings</h2><button id="settings-close" class="mini-btn">esc</button></div>
    <label class="fld-label">OpenRouter API key</label>
    <div class="key-row">
      <code id="key-status" class="key-status">…</code>
      <button id="key-toggle" class="mini-btn">set</button>
    </div>
    <input id="key-input" type="password" placeholder="sk-or-v1-…" class="hidden">
    <div id="key-actions" class="hidden">
      <button id="key-check" class="mini-btn">check</button>
      <button id="key-save" class="mini-btn primary">save key</button>
    </div>
    <p id="key-verify" class="fld-note"></p>
    <label class="fld-label">Model</label>
    <code id="model-name" class="key-status">…</code>
    <label class="fld-label">Reasoning effort</label>
    <div class="seg" id="reasoning-seg">
      <button data-effort="auto">auto</button>
      <button data-effort="low">low</button>
      <button data-effort="medium">medium</button>
      <button data-effort="high">high</button>
    </div>
    <p class="fld-note">auto = picks per message: quick replies get low effort,
      debugging / multi-step tasks get high.</p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
